name: Verify and package native workspace

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native window dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting availability
        run: cargo +stable fmt --all || true
      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          cargo +stable test --workspace 2>&1 | tee /tmp/notepad-test.log
      - name: Publish test diagnostics
        if: steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          log = Path('/tmp/notepad-test.log').read_text(errors='replace')[-60000:]
          payload = {
              'name': 'NotePad Pro test diagnostics',
              'head_sha': '${{ github.sha }}',
              'status': 'completed',
              'conclusion': 'failure',
              'output': {'title': 'cargo test failed', 'summary': log},
          }
          Path('/tmp/check.json').write_text(json.dumps(payload))
          PY
          gh api repos/${{ github.repository }}/check-runs --method POST --input /tmp/check.json
      - name: Fail test job after publishing diagnostics
        if: steps.test.outcome == 'failure'
        run: exit 1
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo +stable clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/notepad-clippy.log
      - name: Publish clippy diagnostics
        if: steps.clippy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          log = Path('/tmp/notepad-clippy.log').read_text(errors='replace')[-60000:]
          payload = {
              'name': 'NotePad Pro clippy diagnostics',
              'head_sha': '${{ github.sha }}',
              'status': 'completed',
              'conclusion': 'failure',
              'output': {'title': 'cargo clippy failed', 'summary': log},
          }
          Path('/tmp/clippy-check.json').write_text(json.dumps(payload))
          PY
          gh api repos/${{ github.repository }}/check-runs --method POST --input /tmp/clippy-check.json
      - name: Fail clippy job after publishing diagnostics
        if: steps.clippy.outcome == 'failure'
        run: exit 1
      - name: Release build
        run: cargo +stable build --release -p notepad-pro

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          wix --version
      - name: Test
        id: windows_test
        continue-on-error: true
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'notepad-windows-test.log'
          & cargo +stable test --workspace 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish Windows test diagnostics
        if: steps.windows_test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'notepad-windows-test.log'
          $log = Get-Content -LiteralPath $logPath -Raw -ErrorAction SilentlyContinue
          if ($null -eq $log) { $log = 'Windows cargo test did not produce a log.' }
          if ($log.Length -gt 60000) { $log = $log.Substring($log.Length - 60000) }
          $payload = @{
            name = 'NotePad Pro Windows test diagnostics'
            head_sha = '${{ github.sha }}'
            status = 'completed'
            conclusion = 'failure'
            output = @{ title = 'Windows cargo test failed'; summary = $log }
          } | ConvertTo-Json -Depth 5 -Compress
          $payload | gh api "repos/$env:GITHUB_REPOSITORY/check-runs" --method POST --input -
      - name: Fail Windows test after publishing diagnostics
        if: steps.windows_test.outcome == 'failure'
        shell: pwsh
        run: exit 1
      - name: Clippy
        id: windows_clippy
        continue-on-error: true
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'notepad-windows-clippy.log'
          & cargo +stable clippy --workspace --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish Windows clippy diagnostics
        if: steps.windows_clippy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'notepad-windows-clippy.log'
          $log = Get-Content -LiteralPath $logPath -Raw -ErrorAction SilentlyContinue
          if ($null -eq $log) { $log = 'Windows cargo clippy did not produce a log.' }
          if ($log.Length -gt 60000) { $log = $log.Substring($log.Length - 60000) }
          $payload = @{
            name = 'NotePad Pro Windows clippy diagnostics'
            head_sha = '${{ github.sha }}'
            status = 'completed'
            conclusion = 'failure'
            output = @{ title = 'Windows cargo clippy failed'; summary = $log }
          } | ConvertTo-Json -Depth 5 -Compress
          $payload | gh api "repos/$env:GITHUB_REPOSITORY/check-runs" --method POST --input -
      - name: Fail Windows clippy after publishing diagnostics
        if: steps.windows_clippy.outcome == 'failure'
        shell: pwsh
        run: exit 1
      - name: Package Windows executable and installer
        id: windows_package
        continue-on-error: true
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'notepad-windows-package.log'
          ./packaging/build-windows.ps1 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish Windows packaging diagnostics
        if: steps.windows_package.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'notepad-windows-package.log'
          $log = Get-Content -LiteralPath $logPath -Raw -ErrorAction SilentlyContinue
          if ($null -eq $log) { $log = 'Windows packaging did not produce a log.' }
          if ($log.Length -gt 60000) { $log = $log.Substring($log.Length - 60000) }
          $payload = @{
            name = 'NotePad Pro Windows packaging diagnostics'
            head_sha = '${{ github.sha }}'
            status = 'completed'
            conclusion = 'failure'
            output = @{ title = 'Windows packaging failed'; summary = $log }
          } | ConvertTo-Json -Depth 5 -Compress
          $payload | gh api "repos/$env:GITHUB_REPOSITORY/check-runs" --method POST --input -
      - name: Fail Windows packaging after publishing diagnostics
        if: steps.windows_package.outcome == 'failure'
        shell: pwsh
        run: exit 1
      - name: Smoke-check package outputs
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'target\release\windows-package\notepad-pro.exe'
          $msi = Join-Path $env:GITHUB_WORKSPACE 'artifacts\NotePad-Pro-1.0.2.msi'
          foreach ($path in @($exe, $msi)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing package output: $path" }
            if ((Get-Item -LiteralPath $path).Length -le 1024) { throw "Package output is unexpectedly small: $path" }
          }
          $header = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe)[0..1])
          if ($header -ne 'MZ') { throw 'The release executable is not a Windows PE file.' }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NotePad-Pro-1.0.2-windows
          if-no-files-found: error
          path: |
            target/release/windows-package/notepad-pro.exe
            artifacts/NotePad-Pro-1.0.2.msi
