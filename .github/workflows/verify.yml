name: Verify native workspace

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native window dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting availability
        run: cargo +stable fmt --all || true
      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          cargo +stable test --workspace 2>&1 | tee /tmp/notepad-test.log
      - name: Publish test diagnostics
        if: steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          log = Path('/tmp/notepad-test.log').read_text(errors='replace')[-60000:]
          payload = {
              'name': 'NotePad Pro test diagnostics',
              'head_sha': '${{ github.sha }}',
              'status': 'completed',
              'conclusion': 'failure',
              'output': {'title': 'cargo test failed', 'summary': log},
          }
          Path('/tmp/check.json').write_text(json.dumps(payload))
          PY
          gh api repos/${{ github.repository }}/check-runs --method POST --input /tmp/check.json
      - name: Fail test job after publishing diagnostics
        if: steps.test.outcome == 'failure'
        run: exit 1
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo +stable clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/notepad-clippy.log
      - name: Publish clippy diagnostics
        if: steps.clippy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          log = Path('/tmp/notepad-clippy.log').read_text(errors='replace')[-60000:]
          payload = {
              'name': 'NotePad Pro clippy diagnostics',
              'head_sha': '${{ github.sha }}',
              'status': 'completed',
              'conclusion': 'failure',
              'output': {'title': 'cargo clippy failed', 'summary': log},
          }
          Path('/tmp/clippy-check.json').write_text(json.dumps(payload))
          PY
          gh api repos/${{ github.repository }}/check-runs --method POST --input /tmp/clippy-check.json
      - name: Fail clippy job after publishing diagnostics
        if: steps.clippy.outcome == 'failure'
        run: exit 1
      - name: Release build
        run: cargo +stable build --release -p notepad-pro
